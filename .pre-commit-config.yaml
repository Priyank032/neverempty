# Install once with: uv run pre-commit install
#
# The ruff rev must stay in step with the version CI runs. Pinned at v0.6.9 it
# could not parse this project's pyproject.toml at all, so every commit failed
# for a reason unrelated to the code -- and a hook that always fails is a hook
# everyone learns to pass --no-verify to, which is worse than no hook.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
