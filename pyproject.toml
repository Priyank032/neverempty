[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "toolproof"
version = "0.0.1"
description = "Evaluate and trace tool-calling LLM agents. Tool failure can never look like an empty result."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
authors = [{ name = "Priyank Agrawal" }]
keywords = ["llm", "agents", "evaluation", "tracing", "tool-calling", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

# Core depends on pydantic v2 only. Everything else is an extra.
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
bedrock = ["boto3>=1.34"]
otel = ["opentelemetry-sdk>=1.26", "opentelemetry-exporter-otlp-proto-http>=1.26"]
all = [
  "toolproof[langgraph]",
  "toolproof[openai]",
  "toolproof[anthropic]",
  "toolproof[bedrock]",
  "toolproof[otel]",
]

[project.scripts]
toolproof = "toolproof.cli:main"

[project.urls]
Homepage = "https://github.com/priyank-agrawal/toolproof"
Repository = "https://github.com/priyank-agrawal/toolproof"
Changelog = "https://github.com/priyank-agrawal/toolproof/blob/main/CHANGELOG.md"
Issues = "https://github.com/priyank-agrawal/toolproof/issues"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "mypy>=1.11",
  "ruff>=0.6",
  # Validates real traces against the committed contract, the way a
  # non-Python exporter would.
  "jsonschema>=4.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toolproof"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/schemas", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "PT",   # flake8-pytest-style
  "RET",  # flake8-return
  "SIM",  # flake8-simplify
  "TID",  # flake8-tidy-imports
  "PTH",  # flake8-use-pathlib
  "RUF",  # ruff-specific
  "ASYNC",
  "S",    # bandit
]
ignore = [
  "S101",  # assert is fine in this codebase's tests
]

[tool.ruff.lint.per-file-ignores]
# Tests may shell out, assert loosely, and block on file I/O inside an
# async test: the event loop there has nothing else to do.
"tests/**" = ["S", "PT011", "ASYNC230", "ASYNC240"]
# The generator imports after a sys.path insert, by design.
"scripts/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["toolproof"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
warn_unreachable = true
warn_unused_ignores = true
disallow_any_unimported = true
no_implicit_reexport = true
enable_error_code = [
  "redundant-expr",
  "truthy-bool",
  "ignore-without-code",
  "possibly-undefined",
]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
]
markers = [
  "benchmark: overhead benchmarks, may be timing sensitive",
  "integration: requires an optional extra to be installed",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/toolproof"]
branch = true
parallel = true

[tool.coverage.paths]
source = ["src/toolproof", "*/site-packages/toolproof"]

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "\\.\\.\\.$",
]
