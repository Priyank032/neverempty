# NextRole eval configuration.
#
# The doc places this in the ai-career-copilot repo; it lives here so neverempty
# ships a config its own CI can validate. Point the agent repo at this file, or
# copy it and change [target].entrypoint.

[project]
name = "nextrole"
neverempty_version = "0.1.0"

[target]
# The live router, not the orchestrator graph: NextRoleOrchestrator is never
# imported by the app and has nodes for only six of the eleven intents. Routing
# suites only; the failure suite needs the live branches wrapped with @tool first.
# Needs ai-career-copilot/backend on PYTHONPATH.
entrypoint = "neverempty.evals.targets:run_nextrole_router"
git_sha_from = "git"
prompt_modules = ["app.agents.intent_router:INTENT_CLASSIFICATION_PROMPT"]
side_effect_tools = ["send_gmail", "save_application", "send_email"]
stubs = "neverempty.evals.targets:STUBS"

[[suite]]
name = "nextrole.routing"
path = "evals/nextrole/routing.jsonl"
split = "test"
suite_version = 1
scorers = ["route", "tool_selection", "forbidden_claims", "calibration"]

[[suite]]
name = "nextrole.failure"
path = "evals/nextrole/failure.jsonl"
split = "test"
suite_version = 1
scorers = ["route", "failure_handling", "false_alarm", "forbidden_claims"]

[run]
repeats = 3
concurrency = 8
case_timeout_s = 120
# max_cost_usd: the live router discards response.usage, so no cost can be
# computed and a budget here would be unenforceable. Restore it once the
# router records usage.
# max_cost_usd = 5.0
seed = 20260921
cache = "evals/.cache"
mode = "live"

[judge]
provider = "bedrock"
model = "anthropic.claude-3-5-sonnet-20241022-v2:0"
agent_family = "openai"
calibration = "evals/calibration/judge.v1.jsonl"

[gate]
baseline = "evals/baselines/nextrole-routing.json"
paired_alpha = 0.05
max_unstable_rate = 0.10
floors = { route_strict = 0.75, misreport_as_empty_max = 0.10 }
warn = { p95_latency_increase = 0.25, cost_increase = 0.20 }

# Required by run.max_cost_usd: with no table every cost is null, the budget
# cannot be measured against, and the runner refuses to start rather than
# pretend it is enforcing one. Keyed by the *resolved* model id.
[pricing]
version = "openai-2026-09-01"

[pricing.models."gpt-4o"]
input_usd_per_mtok = 2.50
output_usd_per_mtok = 10.00
cached_input_usd_per_mtok = 1.25
as_of = "2026-09-01"
source_url = "https://openai.com/api/pricing/"

[pricing.models."gpt-4o-mini"]
input_usd_per_mtok = 0.15
output_usd_per_mtok = 0.60
cached_input_usd_per_mtok = 0.075
as_of = "2026-09-01"
source_url = "https://openai.com/api/pricing/"
